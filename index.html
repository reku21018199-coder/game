<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋、はじめました。 〜白き城とクマの迷宮〜 =LOVE RPG</title>
  <style>
    :root {
      --primary-color: #1e293b;
      --accent-color: #10b981;
      --gold-color: #f59e0b;
      --bg-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 16:9 ゲームスクリーン */
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background: var(--bg-dark);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      border-radius: 8px;
    }

    /* 画面共通スタイル */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* ================= 1. タイトル画面 ================= */
    #title-screen {
      background: linear-gradient(135deg, #e0f2fe 0%, #fbcfe8 100%);
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }

    .title-logo-container {
      margin-bottom: 40px;
    }

    .title-main-text {
      font-size: 3.5rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.8), 2px 2px 4px rgba(0,0,0,0.3);
      font-family: 'Georgia', serif;
      letter-spacing: 2px;
    }

    .title-sub-text {
      font-size: 1.8rem;
      color: #ffffff;
      margin-top: 10px;
      letter-spacing: 4px;
      text-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .start-prompt {
      font-size: 1.4rem;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 3px;
      animation: pulse 1.8s infinite ease-in-out;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      background: rgba(255, 255, 255, 0.25);
      padding: 12px 30px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* ================= 2. メインメニュー ================= */
    #main-menu-screen {
      background: #1e293b;
      padding: 40px;
      color: #fff;
    }

    .menu-header {
      font-size: 1.8rem;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 320px;
    }

    .btn-menu {
      padding: 16px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-menu:hover {
      background: var(--accent-color);
      color: #000;
      transform: translateX(8px);
    }

    /* ================= 3. ADV（アドベンチャー）パート ================= */
    #adv-screen {
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .tachie-container {
      position: absolute;
      bottom: 120px;
      width: 100%;
      height: 380px;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 50px;
      pointer-events: none;
    }

    .tachie-img {
      max-height: 100%;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
      transition: opacity 0.3s, transform 0.3s;
    }

    .tachie-img.inactive {
      opacity: 0.4;
      filter: brightness(0.6);
    }

    /* GBF風 テキストボックス */
    .adv-textbox-container {
      position: absolute;
      bottom: 15px;
      left: 20px;
      right: 20px;
      height: 130px;
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 16px 24px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
    }

    .speaker-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 8px;
      border-left: 4px solid #38bdf8;
      padding-left: 8px;
    }

    .adv-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #f1f5f9;
    }

    .next-indicator {
      position: absolute;
      bottom: 12px;
      right: 20px;
      font-size: 0.9rem;
      color: var(--accent-color);
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ================= 4. メンバー画面 ================= */
    #member-screen {
      background: #0f172a;
      color: #fff;
      padding: 20px;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .member-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }

    .member-card.in-party {
      border-color: var(--accent-color);
      background: rgba(16, 185, 129, 0.15);
    }

    .btn-back {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">

  <!-- 1. タイトル画面 -->
  <div id="title-screen" class="screen active" onclick="goToMenu()">
    <div class="title-logo-container">
      <div class="title-main-text">恋、はじめました。</div>
      <div class="title-sub-text">=LOVE</div>
    </div>
    <div class="start-prompt">✧ TAP TO START ✧</div>
  </div>

  <!-- 2. メインメニュー -->
  <div id="main-menu-screen" class="screen">
    <div class="menu-header">
      <span>メインメニュー</span>
      <span style="font-size: 1rem; color: #94a3b8;">=LOVE RPG</span>
    </div>
    <div class="menu-buttons">
      <button class="btn-menu" onclick="startStory()">📖 ストーリー（新章開始）</button>
      <button class="btn-menu" onclick="openMemberScreen()">👥 メンバー編成・確認</button>
      <button class="btn-menu" onclick="alert('設定：BGM ON / セーブ機能有効')">⚙️ オプション</button>
    </div>
  </div>

  <!-- 3. ADV（ストーリー）画面 -->
  <div id="adv-screen" class="screen">
    <div class="tachie-container">
      <div id="tachie-left" class="tachie-slot"></div>
      <div id="tachie-center" class="tachie-slot"></div>
      <div id="tachie-right" class="tachie-slot"></div>
    </div>

    <div class="adv-textbox-container" onclick="nextDialogue()">
      <div id="adv-speaker" class="speaker-name">発言者名</div>
      <div id="adv-text" class="adv-text">会話テキストがここに表示されます。</div>
      <div class="next-indicator">▼ TAP</div>
    </div>
  </div>

  <!-- 4. メンバー画面 -->
  <div id="member-screen" class="screen">
    <button class="btn-back" onclick="showScreen('main-menu-screen')">戻る</button>
    <h2>メンバーリスト（出撃4人選択）</h2>
    <div id="member-list" class="member-grid"></div>
  </div>

</div>

<script>
  // ================= 画像パス設定（後ほどここを渡された画像ファイル名に置き換えます） =================
  const IMAGE_PATHS = {
    bg_flower: '', // 花畑背景
    bg_castle: '', // 白き城背景
    // メンバー立ち絵プレースホルダー
    EMIRI: '', RISA: '', ANNA: '', SHOKO: '', KIARA: '',
    IORI: '', MAIKA: '', HANA: '', HITOMI: '', SANA: ''
  };

  // 全メンバーデータ
  const MEMBERS = [
    { id: 'KIARA', name: '齋藤 樹愛羅', class: 'Gamer Baby', atk: 1200, def: 150, spd: 500, sta: 450, inParty: true },
    { id: 'RISA',  name: '音嶋 莉沙',   class: 'Ojou-sama Detective', atk: 250, def: 950, spd: 250, sta: 250, inParty: true },
    { id: 'ANNA',  name: '山本 杏奈',   class: 'Small Commander', atk: 150, def: 750, spd: 800, sta: 500, inParty: true },
    { id: 'SHOKO', name: '瀧脇 笙古',   class: 'Athlete Chef', atk: 200, def: 400, spd: 700, sta: 900, inParty: true },
    { id: 'IORI',  name: '野口 衣織',   class: '2D Brain & Summoner', atk: 800, def: 300, spd: 700, sta: 400, inParty: false },
    { id: 'MAIKA', name: '佐々木 舞香', class: 'Energy-Saving Legend', atk: 800, def: 300, spd: 700, sta: 400, inParty: false },
    { id: 'HITOMI',name: '高松 瞳',     class: 'Sunshine Leader', atk: 800, def: 400, spd: 600, sta: 400, inParty: false },
    { id: 'HANA',  name: '大場 花菜',   class: 'Sniper Illustrator', atk: 700, def: 250, spd: 500, sta: 550, inParty: false },
    { id: 'SANA',  name: '諸橋 沙夏',   class: 'Dramatic Diva', atk: 650, def: 650, spd: 400, sta: 300, inParty: false },
    { id: 'EMIRI', name: '大谷 映美里', class: 'Beauty Berserker', atk: 300, def: 700, spd: 500, sta: 450, inParty: false }
  ];

  // OP会話シナリオデータ
  const STORY_SCENARIO = [
    { speaker: '山本 杏奈', text: 'みんな、聞こえる！？ 敵の本拠地はあの白き城だよ！メガホン全開で指示出すから、合図に合わせてついてきて！' },
    { speaker: '齋藤 樹愛羅', text: 'ふふん、任せて！ きあらパイセンのATK 1200で、ボスなんて一撃でゲームオーバーにしてあげるんだから！' },
    { speaker: '音嶋 莉沙', text: 'きあらちゃん、走ると危険ですわ。悪いクマさんなら、この莉沙がDEF 950の鉄壁でお守りします！' },
    { speaker: '瀧脇 笙古', text: 'マラソンで鍛えた私のスタミナ（STA 900）は無限大だよ！ 長期戦になっても絶対に誰も倒れさせないからね！' },
    { speaker: '野口 衣織', text: 'ふふ……チェンソーのエンジン音が鳴り響く。我が深淵に眠る2Dのソウルが叫んでいるよ……覚醒の時だ！' },
    { speaker: '佐々木 舞香', text: 'はぁ……めんどくさいなぁ。お部屋で寝てたいのに。……まぁ、サクッと終わらせて帰ろ。' }
  ];

  let currentDialogueIndex = 0;

  // 画面切り替え処理
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function goToMenu() {
    showScreen('main-menu-screen');
  }

  // ストーリー開始
  function startStory() {
    currentDialogueIndex = 0;
    showScreen('adv-screen');
    updateDialogue();
  }

  // ADV会話送り
  function updateDialogue() {
    const data = STORY_SCENARIO[currentDialogueIndex];
    document.getElementById('adv-speaker').innerText = data.speaker;
    document.getElementById('adv-text').innerText = data.text;
  }

  function nextDialogue() {
    currentDialogueIndex++;
    if (currentDialogueIndex < STORY_SCENARIO.length) {
      updateDialogue();
    } else {
      alert('【第1章：花畑の迷宮】へ進みます！（ダンジョンマップ・バトルフェーズへ）');
      showScreen('main-menu-screen');
    }
  }

  // メンバー画面表示
  function openMemberScreen() {
    showScreen('member-screen');
    const container = document.getElementById('member-list');
    container.innerHTML = MEMBERS.map(m => `
      <div class="member-card ${m.inParty ? 'in-party' : ''}">
        <div style="font-weight:bold; font-size:0.9rem;">${m.name}</div>
        <div style="font-size:0.75rem; color:#94a3b8;">${m.class}</div>
        <div style="font-size:0.8rem; margin-top:6px; color:#38bdf8;">ATK: ${m.atk} / DEF: ${m.def}</div>
        <div style="font-size:0.7rem; color:${m.inParty ? '#10b981' : '#64748b'}; margin-top:4px;">
          ${m.inParty ? '● 出撃中' : '控え'}
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>
